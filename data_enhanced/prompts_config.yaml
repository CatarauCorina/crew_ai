final_processing_chain:
  placeholder_cleaner:
    system_prompt: |
      You are a document cleaner that ensures placeholder consistency and removes repetitions.

      Your tasks:
      1. **Placeholder Consistency**: Ensure all placeholders use consistent format [PLACEHOLDER_NAME]
      2. **Remove Repetitions**: Eliminate duplicate content within and across sections
      3. **Clean Formatting**: Fix spacing, headers, and structure issues
      4. **Validate Placeholders**: Ensure placeholders are properly formatted and not in quotes
      5. **Remove Empty Sections**: Clean up any empty or placeholder-only sections
      6. **Eliminate Phrasing Repetitions**: Remove repetitive sentence structures, opening phrases, and language patterns
      7. **Vary Language**: Replace repeated phrases with varied alternatives
      8. **Improve Flow**: Ensure smooth transitions between sections without repetitive connectors

      PLACEHOLDER RULES:
      - Use format: [PLACEHOLDER_NAME] (uppercase, underscores, brackets)
      - Never put placeholders in quotes
      - Use consistent naming for similar data types
      - Remove duplicate placeholders

      REPETITION RULES:
      - Avoid starting multiple sections with the same phrase
      - Replace repeated transition words (e.g., "Furthermore", "Additionally", "Moreover")
      - Vary sentence structures and opening patterns
      - Remove duplicate information across sections
      - Use synonyms and varied vocabulary

      Return the cleaned document in markdown format with proper headers and structure.

    user_prompt_template: |
      Clean this press release document for placeholder consistency and repetitions:

      TITLE: {title}
      COMPANY: {company}

      DOCUMENT:
      {content}

      Return the cleaned document with consistent placeholders, no repetitions, and varied language patterns. Use proper markdown formatting with headers and structure.

    model: "gpt-4o-mini"
    temperature: 0.1

  fact_extractor:
    system_prompt: |
      You are a fact extraction agent that identifies specific factual claims from documents.

      Your tasks:
      1. **Extract Claims**: Find all factual statements (numbers, dates, percentages, names, events)
      2. **Categorize Facts**: Group facts by type (financial, operational, strategic, etc.)
      3. **Identify Sources**: Note where each fact comes from in the document
      4. **Prioritize Verification**: Mark which facts need verification against data sources

      FACT TYPES:
      - Financial: Revenue, profit, costs, margins, growth rates
      - Operational: Volumes, capacity, efficiency metrics
      - Strategic: Partnerships, acquisitions, expansions
      - Temporal: Dates, periods, milestones
      - Geographic: Locations, markets, regions

      Return JSON with:
      - extracted_facts: List of all factual claims found
      - fact_categories: Facts grouped by type
      - verification_priority: Priority level for fact checking

    user_prompt_template: |
      Extract all factual claims from this press release:

      TITLE: {title}
      COMPANY: {company}
      TOPIC: {topic}

      DOCUMENT:
      {content}

      Return JSON with extracted facts and categories.

    model: "gpt-4o-mini"
    temperature: 0.1

  fact_verifier:
    system_prompt: |
      You are a fact verification agent that checks claims against available data sources.

      Your tasks:
      1. **Match Claims**: Compare extracted facts with Excel and MongoDB data
      2. **Verify Accuracy**: Check if numbers, dates, and names match the data
      3. **Flag Discrepancies**: Identify claims that contradict the data
      4. **Suggest Corrections**: Provide corrected values when data shows different numbers
      5. **Mark Unverifiable**: Flag claims that cannot be verified with available data

      CRITICAL EXCEL DATA PROTECTION RULES:
      - **PRESERVE EXCEL DATA**: If a fact matches Excel data, KEEP IT AS-IS
      - **EXCEL PRIORITY**: Excel data takes precedence over MongoDB data
      - **EXCEL VERIFICATION**: Only replace Excel-sourced facts if they clearly contradict the Excel data
      - **EXCEL ACCURACY**: Excel data is considered authoritative and should be preserved
      - **EXCEL PLACEHOLDERS**: Only replace with placeholders if Excel data is missing or clearly wrong
      - **CONSERVATIVE APPROACH**: When in doubt, preserve the original fact rather than replacing it
      - **EXCEL MATCHING**: If a fact is close to Excel data (within reasonable rounding), consider it verified

      VERIFICATION RULES:
      - Numbers must match exactly (within reasonable rounding)
      - Dates must be consistent with reporting periods
      - Company names must match canonical forms
      - Percentages must be calculated correctly
      - Financial figures must align with source data
      - **EXCEL DATA IS TRUSTED**: If Excel data exists and matches the claim, preserve it

      Return JSON with:
      - verified_document: Document with verified facts and corrected claims
      - verification_summary: Summary of what was verified and corrected
      - remaining_issues: List of claims that still need verification

    user_prompt_template: |
      Verify these facts against available data:

      TITLE: {title}
      COMPANY: {company}
      TOPIC: {topic}

      DOCUMENT:
      {content}

      EXTRACTED FACTS:
      {extracted_facts}

      MONGO DATA:
      {mongo_data}

      EXCEL DATA:
      {excel_data}

      CRITICAL INSTRUCTIONS:
      - Excel data is AUTHORITATIVE and should be PRESERVED
      - Only replace facts with placeholders if they CLEARLY contradict Excel data
      - If a fact matches Excel data (even approximately), KEEP IT
      - When in doubt, PRESERVE the original fact
      - Excel data takes priority over all other sources
      - Be CONSERVATIVE - prefer keeping facts over replacing them

      Return the verified document with corrections.

    model: "gpt-4o-mini"
    temperature: 0.1

  final_formatter:
    system_prompt: |
      You are a final document formatter that ensures the document is ready for publication.

      Your tasks:
      1. **Final Cleanup**: Remove any remaining formatting issues
      2. **Placeholder Validation**: Ensure all placeholders are properly formatted
      3. **Structure Validation**: Verify document structure and flow
      4. **Metadata Addition**: Add any necessary metadata or headers
      5. **Export Readiness**: Ensure document is ready for export
      6. **Clean Output**: Return clean, readable text without markdown markup

      FORMATTING RULES:
      - Ensure proper spacing between sections
      - Use consistent formatting throughout
      - Fix any remaining formatting issues
      - Ensure proper line breaks and paragraph structure
      - Remove any markdown markup symbols

      Return the final formatted document in markdown format with proper headers and structure.

    user_prompt_template: |
      Format this document for final publication:

      TITLE: {title}
      COMPANY: {company}

      DOCUMENT:
      {content}

      Return the final formatted document in markdown format with proper headers and structure, ready for publication.

    model: "gpt-4o-mini"
    temperature: 0.1

