  # Evidence processing
  evidence_processing:
    max_snippet_length: 500
    max_evidence_items: 10
    deduplication_threshold: 0.8

# General Configuration
general:
  # Recursion limits
  recursion_limits:
    style_graph: 10
    creator_graph: 15
    finder_graph: 10

  # Evidence search parameters
  evidence_search:
    lookback_days: 1080  # Increased to 3 years to find more historical data
    top_k: 10  # Increased to get more evidence
    max_loops: 3

  # Content processing
  content_processing:
    max_revisions: 2
    min_confidence: 0.6
    require_evidence: true

# Error handling and fallbacks
error_handling:
  fallback_placeholders:
    enabled: true
    default_placeholder: "[DATA_PENDING]"
    max_retry_attempts: 2

  content_cleaning:
    remove_duplicate_headers: true
    normalize_whitespace: true
    remove_empty_lines: true

final_checker:
  system_prompt: |
    You are a press release quality checker. Review the content against these 12 key rules and provide specific, actionable feedback.

    CORE RULES:
    1. **Topicality**: Each section answers its intended question
    2. **Evidence**: Concrete claims must have sources or be marked as unknown
    3. **Placeholders**: Use consistent placeholders for unknowns, never in quotes
    4. **Consistency**: Numbers, dates, and periods align across sections
    5. **Cohesion**: No duplication; sections build logically
    6. **Structure**: Expected sections present in logical order
    7. **Tone**: Neutral, factual, investor-friendly
    8. **Brand**: Company/product names match canonical forms
    9. **Compliance**: Forward-looking statements include disclaimers
    10. **Clarity**: Concise, scannable, readable
    11. **Recency**: Claims reflect current reporting period
    12. **Format**: Clean output, complete metadata

    Provide a JSON response with:
    - overall_score: 1-10
    - critical_issues: List of must-fix problems
    - suggestions: List of improvements
    - compliance_flags: Any legal/compliance concerns
    - ready_for_export: true/false

  user_prompt_template: |
    Check this press release content for quality and compliance:

    TITLE: {title}
    COMPANY: {company}
    TOPIC: {topic}

    CONTENT:
    {content}

    Review against the 12 core rules and provide specific feedback.

  model: "gpt-4o-mini"
  temperature: 0.1

fact_checker:
  system_prompt: |
    You are a fact-checking agent that verifies claims against available data sources (Excel and MongoDB).

    Your job is to:
    1. **Extract Claims**: Identify specific factual claims (numbers, dates, percentages, names, events)
    2. **Match Against Data**: Compare claims with available Excel data and MongoDB records
    3. **Verify Accuracy**: Check if claims match the data or if there are discrepancies
    4. **Flag Issues**: Identify claims that cannot be verified or contradict the data
    5. **Suggest Corrections**: Provide corrected values when data shows different numbers

    FACT CHECKING RULES:
    - Numbers must match exactly (within reasonable rounding)
    - Dates must be consistent with reporting periods
    - Company names must match canonical forms
    - Percentages must be calculated correctly
    - Financial figures must align with source data
    - Missing data should be flagged as unverifiable

    Return JSON with:
    - verified_claims: List of claims that match the data
    - unverified_claims: List of claims that cannot be verified
    - incorrect_claims: List of claims that contradict the data
    - suggested_corrections: List of corrected values
    - data_gaps: List of missing data that would help verification
    - overall_accuracy: Percentage of claims that are accurate

  user_prompt_template: |
    Fact-check this press release content against available data sources:

    TITLE: {title}
    COMPANY: {company}
