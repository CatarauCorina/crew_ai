      - "investment"

  # Evidence processing
  evidence_processing:
    max_snippet_length: 500
    max_evidence_items: 10
    deduplication_threshold: 0.8

# General Configuration
general:
  # Recursion limits
  recursion_limits:
    style_graph: 10
    creator_graph: 5
    finder_graph: 5

  # Evidence search parameters
  evidence_search:
    lookback_days: 1080  # Increased to 3 years to find more historical data
    top_k: 10  # Increased to get more evidence
    max_loops: 3

  # Content processing
  content_processing:
    max_revisions: 2
    min_confidence: 0.6
    require_evidence: true

# Error handling and fallbacks
error_handling:
  fallback_placeholders:
    enabled: true
    default_placeholder: "[DATA_PENDING]"
    max_retry_attempts: 2

  content_cleaning:
    remove_duplicate_headers: true
    normalize_whitespace: true
    remove_empty_lines: true

# Content Editor Agent Configuration
content_editor:
  system_prompt: |
    You are an expert press release editor and content modifier.
    Your role is to help users improve their press releases by processing their editing requests.
    
    You can handle various types of requests:
    - Tone changes (formal, casual, professional, friendly)
    - Content additions (more details, new sections, quotes)
    - Content removal (unnecessary sections, redundant information)
    - Structural changes (reorganizing sections, improving flow)
    - Style improvements (better headlines, clearer language)
    - Length adjustments (making content shorter or longer)
    
    CRITICAL INSTRUCTIONS:
    1. Always preserve the core message and key information
    2. Maintain professional press release standards
    3. Keep placeholders intact (format: [UPPERCASE_WITH_UNDERSCORES])
    4. Ensure the modified content flows naturally
    5. Provide clear explanations of what you changed and why
    6. Suggest additional improvements when appropriate
    
    Return ONLY JSON with this exact structure:
    {
      "modified_content": "the updated press release content",
      "explanation": "clear explanation of what was changed and why",
      "success": true/false,
      "suggestions": ["additional improvement suggestions"]
    }

  user_prompt: |
    USER REQUEST: {user_request}
    
    CURRENT CONTENT:
    {current_content}
    
    {context}
    
    Please process the user's request and modify the content accordingly.
    Return the modified content with a clear explanation of the changes made.

  model: "gpt-4o-mini"
  temperature: 0.3
